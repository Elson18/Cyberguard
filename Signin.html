<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EchoVision — Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="page-auth">

<div class="bg-canvas" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-blob bg-blob--blue"></div>
  <div class="bg-blob bg-blob--cyan"></div>
  <div class="bg-blob bg-blob--emerald"></div>
</div>

<div class="auth-card">
  <div class="card-logo">
    <div class="logo-icon">EC</div>
    <div class="logo-name">EchoVision</div>
    <div class="logo-sub">Create your secure account</div>
  </div>

  <div class="divider"><span>Registration</span></div>

  <div class="alert" id="alertBox"></div>

  <div class="field">
    <label for="name">Username</label>
    <div class="field-inner">
      <svg class="field-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <input type="text" id="name" placeholder="Choose a username…" autocomplete="username">
    </div>
  </div>

  <div class="field">
    <label for="email">Email</label>
    <div class="field-inner">
      <svg class="field-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
    </div>
  </div>

  <div class="field">
    <label for="phone_no">Mobile Number</label>
    <div class="field-inner">
      <svg class="field-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      <input type="text" id="phone_no" placeholder="+91 XXXXX XXXXX" autocomplete="tel">
    </div>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="field-inner">
      <svg class="field-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input type="password" id="password" placeholder="Create a strong password…" autocomplete="new-password">
    </div>
  </div>

  <div class="field">
    <label for="re_password">Confirm Password</label>
    <div class="field-inner">
      <svg class="field-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <input type="password" id="re_password" placeholder="Repeat password…" autocomplete="new-password">
    </div>
  </div>

  <button class="btn-signup" onclick="register()">Create Account →</button>

  <div class="card-footer">
    <a href="login.html">Already have an account? <span>Login →</span></a>
  </div>
</div>

<script>
function showAlert(msg, type = "error") {
  const el = document.getElementById("alertBox");
  el.textContent = msg;
  el.className = `alert ${type} show`;
  setTimeout(() => el.classList.remove("show"), 4000);
}

async function register() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone_no = document.getElementById("phone_no").value.trim();
  const password = document.getElementById("password").value;
  const re_password = document.getElementById("re_password").value;

  if (!name || !email || !phone_no || !password || !re_password) {
    showAlert("All fields are required"); return;
  }

  try {
    const res = await fetch("http://127.0.0.1:8000/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, phone_no, password, re_password })
    });

    const data = await res.json();

    if (res.status === 200 || res.status === 201) {
      showAlert("Registration successful! Redirecting…", "success");
      setTimeout(() => window.location.href = "index.html", 1500);
    } else {
      showAlert(data.detail || "Registration failed");
    }
  } catch (error) {
    console.error(error);
    showAlert("Server error. Please try again.");
  }
}
</script>
</body>
</html>
