<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EchoVision — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="page-auth">

<div class="bg-canvas" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-blob bg-blob--blue"></div>
  <div class="bg-blob bg-blob--cyan"></div>
</div>

<div class="auth-card">
  <div class="card-logo">
    <div class="logo-icon">EC</div>
    <div class="logo-name">EchoVision</div>
    <div class="logo-sub">Cybercrime Support Platform</div>
  </div>

  <div class="divider"><span>Secure Login</span></div>

  <div class="alert" id="alertBox"></div>

  <div class="field">
    <label for="username">Email or Username</label>
    <div class="field-inner">
      <svg class="field-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <input type="text" id="username" placeholder="Enter identifier…" autocomplete="username">
    </div>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="field-inner">
      <svg class="field-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input type="password" id="password" placeholder="Enter password…" autocomplete="current-password" onkeydown="if(event.key==='Enter') login()">
    </div>
  </div>

  <button class="btn-login" onclick="login()">Access System →</button>

  <div class="card-footer">
    <a href="#">Forgot Password?</a>
    <a href="Signin.html">No account? <span>Create one →</span></a>
  </div>
</div>

<script>
function showAlert(msg) {
  const el = document.getElementById("alertBox");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 4000);
}

function login() {
  const identifier = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  if (!identifier || !password) { showAlert("Please fill all fields"); return; }

  fetch("https://cyberguard-api-zxry.onrender.com/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ identifier, password })
  })
  .then(res => res.json().then(data => ({ status: res.status, data })))
  .then(({ status, data }) => {
    if (status === 200) {
      localStorage.setItem("user_id", data.user_id);
      localStorage.setItem("username", identifier);
      window.location.href = "index.html";
    } else if (status === 404) {
      showAlert("User not found. Please create an account.");
      setTimeout(() => window.location.href = "Signin.html", 1500);
    } else {
      showAlert(data.detail || "Invalid credentials");
    }
  })
  .catch(() => showAlert("Server error. Please try again."));
}
</script>
</body>
</html>
