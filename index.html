<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EchoVision — Cyber Support</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-dashboard">

<div class="bg-canvas" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-blob bg-blob--blue"></div>
  <div class="bg-blob bg-blob--cyan"></div>
  <div class="bg-blob bg-blob--emerald"></div>
</div>

<div class="app">

  <aside class="sidebar">
    <div class="logo-wrap">
      <div class="logo-icon">CG</div>
      <div class="logo-text">
        <strong>CyberGuard</strong>
        <span>Multilingual CyberCrime Support<br>RAG + Agentic AI</span>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-dot"></div>
      <span class="status-text">SYSTEM ACTIVE</span>
    </div>

    <button class="btn-new" onclick="clearChat()">+ New Session</button>

    <div class="sidebar-panel">
      <div class="sidebar-panel-title">System Status</div>
      <div class="sidebar-stat">
        <span>RAG Engine</span>
        <span class="online">● Online</span>
      </div>
      <div class="sidebar-stat">
        <span>AI Model</span>
        <span class="online">● Active</span>
      </div>
      <div class="sidebar-stat">
        <span>Threat DB</span>
        <span class="online">● Synced</span>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-row">
        <div class="user-info">
          <div class="user-avatar" id="userAvatarLetter">U</div>
          <div>
            <div class="user-name" id="userName">—</div>
            <div class="user-label">● Active</div>
          </div>
        </div>
        <button class="btn-logout" onclick="logout()">Exit</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <div>
        <div class="main-title">Cyber Incident Assistant</div>
        <div class="main-subtitle">Secure end-to-end session · All data encrypted</div>
      </div>
      <div class="tag">AI Powered</div>
    </div>

    <div class="pane" id="pane">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🛡️</div>
        <p>Start a conversation to get expert cyber support</p>
      </div>
    </div>

    <div class="composer">
      <div class="composer-input-wrap">
        <svg class="composer-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="messageInput" placeholder="Describe your incident or ask a question…" aria-label="Message" />
      </div>
      <button class="btn-send" id="sendBtn" title="Send" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </main>

</div>

<script>
  const username = localStorage.getItem("username");
  if (!username) location.href = "login.html";

  document.getElementById("userName").innerText = username;
  const letter = username ? username[0].toUpperCase() : "U";
  document.getElementById("userAvatarLetter").innerText = letter;

  const pane = document.getElementById("pane");
  const input = document.getElementById("messageInput");
  const STORAGE_KEY = `chat_${username}`;

  function formatMessage(text) {
    if (!text) return "";
    text = text
      .replace(/^###### (.*$)/gim, "<h6>$1</h6>")
      .replace(/^##### (.*$)/gim, "<h5>$1</h5>")
      .replace(/^#### (.*$)/gim, "<h4>$1</h4>")
      .replace(/^### (.*$)/gim, "<h3>$1</h3>")
      .replace(/^## (.*$)/gim, "<h2>$1</h2>")
      .replace(/^# (.*$)/gim, "<h1>$1</h1>")
      .replace(/\*\*(.*?)\*\*/gim, "<b>$1</b>")
      .replace(/\*(.*?)\*/gim, "<i>$1</i>")
      .replace(/^\s*-\s+(.*)$/gim, "<li>$1</li>")
      .replace(/(<li>.*<\/li>)/gim, "<ul>$1</ul>")
      .replace(/^\s*\d+\.\s+(.*)$/gim, "<li>$1</li>")
      .replace(/(<li>.*<\/li>)/gim, "<ol>$1</ol>")
      .replace(/^> (.*)$/gim, "<blockquote>$1</blockquote>")
      .replace(/^---$/gim, "<hr>");
    return text;
  }

  function saveChat() { localStorage.setItem(STORAGE_KEY, pane.innerHTML); }

  function loadChat() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      pane.innerHTML = saved;
      pane.scrollTop = pane.scrollHeight;
    }
  }

  function hideEmpty() {
    const empty = document.getElementById("emptyState");
    if (empty) empty.remove();
  }

  function addMessage(text, type) {
    hideEmpty();
    const msg = document.createElement("div");
    msg.className = "message " + type;
    const avatarLabel = type === "user" ? (username ? username[0].toUpperCase() : "U") : "AI";
    msg.innerHTML = `
      <div class="avatar">${avatarLabel}</div>
      <div class="bubble">${formatMessage(text)}</div>
    `;
    pane.appendChild(msg);
    pane.scrollTop = pane.scrollHeight;
    saveChat();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    const typing = document.createElement("div");
    typing.className = "message bot";
    typing.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
    `;
    pane.appendChild(typing);
    pane.scrollTop = pane.scrollHeight;

    const res = await fetch("http://127.0.0.1:8000/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: text, username })
    });

    const data = await res.json();
    typing.remove();

    if (data.redirect === true) {
      addComplaintButton(data.answer);
      return;
    }

    addMessage(data.answer, "bot");
  }

  function addComplaintButton(answerText) {
    hideEmpty();
    const msg = document.createElement("div");
    msg.className = "message bot";
    msg.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble">
        ${formatMessage(answerText)}
        <br>
        <button class="btn-complaint" onclick="goToComplaint()">
          🛡️ File Cyber Complaint
        </button>
      </div>
    `;
    pane.appendChild(msg);
    pane.scrollTop = pane.scrollHeight;
    saveChat();
  }

  function goToComplaint() { window.location.href = "complaint.html"; }

  loadChat();

  const params = new URLSearchParams(window.location.search);
  if (params.get("from") === "complaint") {
    addMessage("✅ Your cyber complaint has been submitted successfully. Our cyber team will contact you shortly.", "bot");
    history.replaceState(null, "", "index.html");
  }

  document.getElementById("sendBtn").onclick = sendMessage;
  input.addEventListener("keydown", e => e.key === "Enter" && sendMessage());

  function clearChat() {
    localStorage.removeItem(STORAGE_KEY);
    pane.innerHTML = `<div class="empty-state" id="emptyState"><div class="empty-icon">🛡️</div><p>Start a conversation to get expert cyber support</p></div>`;
  }
  function logout() { localStorage.removeItem("username"); location.href = "login.html"; }
</script>
</body>
</html>
